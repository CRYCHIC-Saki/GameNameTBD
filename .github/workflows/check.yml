name: Godot cooking checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Acquire locked Godot
        shell: pwsh
        run: |
          $url = 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest $url -OutFile engine.zip
          Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/SHA512-SUMS.txt' -OutFile sums.txt
          $line = Get-Content sums.txt | Where-Object { $_ -match ' Godot_v4.7.2-stable_win64.exe.zip$' }
          if (-not $line) { throw 'Missing official checksum' }
          $expected = ($line -split '\s+')[0]
          if ((Get-FileHash engine.zip -Algorithm SHA512).Hash -ne $expected) { throw 'Checksum mismatch' }
          Expand-Archive engine.zip -DestinationPath engine
          "GODOT_BIN=$((Get-ChildItem engine -Filter '*console.exe').FullName)" >> $env:GITHUB_ENV
      - name: Run shared check entry
        shell: pwsh
        run: ./tools/check.ps1 -ShardCount 4 -ShardIndex ${{ matrix.shard }} -ReportName ci-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence-${{ matrix.shard }}
          path: artifacts/check/
